name: Build ARM64 portable package

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Check Python
        run: python3 --version

      - name: Build portable tarball
        run: |
          chmod +x packaging/build-portable.sh
          ./packaging/build-portable.sh --arch arm64

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: FFConverter-portable-arm64
          path: dist/FFConverter-portable-arm64.tar.xz

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/FFConverter-portable-arm64.tar.xz
            dist/FFConverter-portable-arm64.tar.xz.sha256
