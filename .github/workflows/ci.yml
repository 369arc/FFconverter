name: Build and test

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install runtime and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-tk xvfb
      - name: Vendor Python dependencies
        run: python3 packaging/vendor.py vendor
      - name: Unit tests
        env:
          PYTHONPATH: vendor
        run: python3 -m unittest discover -s tests -v
      - name: Smoke test (headless GUI)
        env:
          PYTHONPATH: vendor
        run: |
          xvfb-run -a timeout 8 python3 ffc.py --version

  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build .deb
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 dpkg-dev
          chmod +x packaging/*.sh
          ./packaging/build-deb.sh
      - uses: actions/upload-artifact@v7
        with:
          name: deb
          path: dist/*.deb

  rpm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build .rpm
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 rpm
          chmod +x packaging/*.sh
          ./packaging/build-rpm.sh
      - uses: actions/upload-artifact@v7
        with:
          name: rpm
          path: dist/*.rpm

  portable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build portable tarball
        run: |
          chmod +x packaging/*.sh
          ./packaging/build-portable.sh --arch x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: portable-x86_64
          path: dist/FFConverter-portable-x86_64.tar.xz

  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build AppImage in Ubuntu 22.04
        run: |
          chmod +x packaging/*.sh
          CONTAINER_ENGINE=docker ./packaging/build-appimage.sh
      - uses: actions/upload-artifact@v7
        with:
          name: appimage-x86_64
          path: dist/FFConverter-*-x86_64.AppImage

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build Windows ZIP and EXE
        shell: pwsh
        run: ./packaging/build-windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          path: |
            dist/FFConverter-*-windows-x86_64.exe
            dist/FFConverter-*-windows-x86_64.zip

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Select Python with tkinter
        run: |
          for candidate in python3.12 python3 /usr/local/bin/python3.12 /usr/bin/python3; do
            if command -v "$candidate" >/dev/null 2>&1 && \
               "$candidate" -c 'import tkinter' >/dev/null 2>&1; then
              echo "PYTHON=$(command -v "$candidate")" >> "$GITHUB_ENV"
              "$candidate" -c 'import tkinter; print("Tk", tkinter.TkVersion)'
              exit 0
            fi
          done
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            brew install python@3.12 python-tk@3.12
            echo "PYTHON=$(brew --prefix python@3.12)/bin/python3.12" >> "$GITHUB_ENV"
          else
            echo "No Python 3.12 with tkinter found" >&2
            exit 1
          fi
      - name: Build DMG
        run: |
          chmod +x packaging/build-macos.sh
          ./packaging/build-macos.sh
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: dist/FFConverter-*-macos-*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, deb, rpm, portable, appimage, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
