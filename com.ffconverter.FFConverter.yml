app-id: com.ffconverter.FFConverter
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: ffconverter-launcher

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home

add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    add-ld-path: .
    version: '25.08'
    autodownload: true

modules:
  - name: tcl
    buildsystem: simple
    build-commands:
      - cd unix && ./configure --prefix=/app --enable-threads --enable-shared && make -j"$(nproc)" && make install && chmod -R u+w /app/bin /app/lib /app/include
    sources:
      - type: archive
        url: https://prdownloads.sourceforge.net/tcl/tcl8.6.15-src.tar.gz
        sha256: 861e159753f2e2fbd6ec1484103715b0be56be3357522b858d3cbb5f893ffef1

  - name: tk
    buildsystem: simple
    build-commands:
      - cd unix && ./configure --prefix=/app --with-tcl=/app/lib --enable-threads --enable-shared --with-x && make -j"$(nproc)" && make install && chmod -R u+w /app/bin /app/lib /app/include
    sources:
      - type: archive
        url: https://prdownloads.sourceforge.net/tcl/tk8.6.15-src.tar.gz
        sha256: 550969f35379f952b3020f3ab7b9dd5bfd11c1ef7c9b7c6a75f5c49aca793fec

  - name: python-tkinter
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/python3.13/site-packages
      - gcc -shared -fPIC $(python3-config --includes) -I/app/include -I/usr/include/python3.13/internal -Wl,-rpath,/app/lib -o /app/lib/python3.13/site-packages/_tkinter$(python3-config --extension-suffix) Modules/_tkinter.c -L/app/lib -ltk8.6 -ltcl8.6 -lX11 -lpthread -ldl -lutil -lm
      - cp -r Lib/tkinter /app/lib/python3.13/site-packages/
    sources:
      - type: archive
        url: https://www.python.org/ftp/python/3.13.14/Python-3.13.14.tgz
        sha256: 5ae535a36af0ebca6fca176ecb8197f5db9c1cb8c8f0cd12cdf1787046db1f41

  - name: python-deps
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --ignore-installed packaging-26.2-py3-none-any.whl darkdetect-0.8.0-py3-none-any.whl customtkinter-5.2.2-py3-none-any.whl send2trash-2.1.0-py3-none-any.whl tkinterdnd2-0.4.3-py3-none-any.whl
    sources:
      - type: file
        path: pip-wheels/packaging-26.2-py3-none-any.whl
      - type: file
        path: pip-wheels/darkdetect-0.8.0-py3-none-any.whl
      - type: file
        path: pip-wheels/customtkinter-5.2.2-py3-none-any.whl
      - type: file
        path: pip-wheels/send2trash-2.1.0-py3-none-any.whl
      - type: file
        path: pip-wheels/tkinterdnd2-0.4.3-py3-none-any.whl

  - name: ffconverter-app
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin /app/share/ffconverter /app/share/applications /app/share/icons/hicolor/256x256/apps /app/share/licenses/com.ffconverter.FFConverter
      - cp ffc.py /app/share/ffconverter/
      - mkdir -p /app/share/ffconverter/resources
      - cp -r icon.ico images /app/share/ffconverter/resources/
      - cp ffconverter-launcher /app/bin/
      - cp com.ffconverter.FFConverter.desktop /app/share/applications/
      - cp com.ffconverter.FFConverter.png /app/share/icons/hicolor/256x256/apps/
      - cp LICENSE /app/share/licenses/com.ffconverter.FFConverter/
      - cp THIRD_PARTY_NOTICES.md /app/share/licenses/com.ffconverter.FFConverter/
      - chmod +x /app/bin/ffconverter-launcher
    sources:
      - type: file
        path: ffc.py
      - type: dir
        path: resources
      - type: file
        path: ffconverter-launcher
      - type: file
        path: com.ffconverter.FFConverter.desktop
      - type: file
        path: com.ffconverter.FFConverter.png
      - type: file
        path: LICENSE
      - type: file
        path: THIRD_PARTY_NOTICES.md
